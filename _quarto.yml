project:
  type: website

# Strona ma dwie wersje językowe budowane z tych samych plików .qmd:
#   quarto render                 -> wersja polska  (docs/)
#   quarto render --profile en    -> wersja angielska (docs/en/)
# Ustawienia zależne od języka są w plikach _quarto-pl.yml i _quarto-en.yml.
profile:
  default: pl
  group:
    - [pl, en]

website:
  favicon: assets/icons/favicon_jm.svg
  image: assets/images/jm.webp
  twitter-card: true

filters:
  - wersje_jezykowe_canonical_hreflang.lua

format:
  html:
    theme:
      - cosmo
      - motyw_miszczyszyn_org.scss
    toc: false
    html-math-method: plain
    link-external-newwindow: true
    include-after-body: przelacznik_jezyka.html
